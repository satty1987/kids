<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
      <!-- Menu Screen -->
    <div id="menuScreen" class="screen active">
        <h1 class="title">🎓 Kids Learning Hub 🎓</h1>
        <div class="menu-grid">
            <button class="menu-btn" onclick="showScreen('abc')">
                🔤 Learn ABC
            </button>
            <button class="menu-btn green" onclick="showScreen('123')">
                🔢 Count 1-20
            </button>
            <button class="menu-btn orange" onclick="showScreen('colors')">
                🎨 Learn Colors
            </button>
            <button class="menu-btn pink" onclick="showScreen('shapes')">
                ⭐ Learn Shapes
            </button>
            <button class="menu-btn indigo" onclick="showScreen('animals')">
                🦁 Animal Sounds
            </button>
            <button class="menu-btn" onclick="showScreen('quiz')">
                ❓ Quiz Time
            </button>
        </div>
        <div class="menu-icons">
            <span class="icon">⭐</span>
            <span class="icon" style="animation-delay: 1s;">❤️</span>
            <span class="icon" style="animation-delay: 2s;">✨</span>
        </div>
    </div>

    <!-- ABC Screen -->
    <div id="abcScreen" class="screen">
        <button class="back-btn" onclick="showScreen('menu')">← Back to Menu</button>
        <div class="score">Score: <span id="abcScore">0</span> ⭐</div>
        <div class="learning-card">
            <div class="letter-display" id="letterDisplay">A</div>
            <div class="word-display" id="wordDisplay">🍎 Apple</div>
            <button class="say-btn" onclick="sayLetter()">
                🔊 Say it!
            </button>
        </div>
        <div class="nav-buttons">
            <button class="nav-btn" onclick="previousItem('abc')" id="abcPrev">← Previous</button>
            <button class="nav-btn next" onclick="nextItem('abc')" id="abcNext">Next →</button>
        </div>
    </div>

    <!-- Number Screen -->
    <div id="numberScreen" class="screen">
        <button class="back-btn" onclick="showScreen('menu')">← Back to Menu</button>
        <div class="score">Score: <span id="numberScore">0</span> ⭐</div>
        <div class="learning-card">
            <div class="number-display" id="numberDisplay">1</div>
            <div class="emoji-display" id="emojiDisplay">1️⃣</div>
            <div class="dots-container" id="dotsContainer"></div>
            <button class="say-btn green" onclick="sayNumber()">
                🔊 Say it!
            </button>
        </div>
        <div class="nav-buttons">
            <button class="nav-btn" onclick="previousItem('123')" id="numPrev">← Previous</button>
            <button class="nav-btn next" onclick="nextItem('123')" id="numNext">Next →</button>
        </div>
    </div>

    <!-- Colors Screen -->
    <div id="colorsScreen" class="screen">
        <button class="back-btn" onclick="showScreen('menu')">← Back to Menu</button>
        <div class="score">Score: <span id="colorsScore">0</span> ⭐</div>
        <div class="learning-card">
            <div class="word-display" id="colorName">Red</div>
            <div class="color-box" id="colorBox" style="background: #ef4444;"></div>
            <button class="say-btn orange" onclick="sayColor()">
                🔊 Say it!
            </button>
        </div>
        <div class="nav-buttons">
            <button class="nav-btn" onclick="previousItem('colors')" id="colorPrev">← Previous</button>
            <button class="nav-btn next" onclick="nextItem('colors')" id="colorNext">Next →</button>
        </div>
    </div>

    <!-- Shapes Screen -->
    <div id="shapesScreen" class="screen">
        <button class="back-btn" onclick="showScreen('menu')">← Back to Menu</button>
        <div class="score">Score: <span id="shapesScore">0</span> ⭐</div>
        <div class="learning-card">
            <div class="word-display" id="shapeName">Circle</div>
            <div class="shape-container" id="shapeContainer">
                <div class="shape shape-circle"></div>
            </div>
            <button class="say-btn indigo" onclick="sayShape()">
                🔊 Say it!
            </button>
        </div>
        <div class="nav-buttons">
            <button class="nav-btn" onclick="previousItem('shapes')" id="shapePrev">← Previous</button>
            <button class="nav-btn next" onclick="nextItem('shapes')" id="shapeNext">Next →</button>
        </div>
    </div>

    <!-- Animals Screen -->
    <div id="animalsScreen" class="screen">
        <button class="back-btn" onclick="showScreen('menu')">← Back to Menu</button>
        <div class="score">Score: <span id="animalsScore">0</span> ⭐</div>
        <div class="learning-card">
            <div class="emoji-display" id="animalEmoji">🐶</div>
            <div class="word-display" id="animalName">Dog</div>
            <button class="say-btn green" onclick="sayAnimal()">
                🔊 Hear the sound!
            </button>
        </div>
        <div class="nav-buttons">
            <button class="nav-btn" onclick="previousItem('animals')" id="animalPrev">← Previous</button>
            <button class="nav-btn next" onclick="nextItem('animals')" id="animalNext">Next →</button>
        </div>
    </div>

    <!-- Quiz Screen -->
    <div id="quizScreen" class="screen">
        <button class="back-btn" onclick="showScreen('menu')">← Back to Menu</button>
        <div class="score">Quiz</div>
        <div class="learning-card" id="quizCard">
            <div class="word-display" id="quizQuestion">Loading question...</div>
            <div class="word-display" id="quizAnswer" style="display:none; font-weight:700;">Answer</div>
                            <button class="say-btn orange" onclick="toggleAnswer()">Show/Hide Answer</button>

            <div style="margin-top:18px; display:flex; gap:12px; justify-content:center;">
                <button class="nav-btn" id="quizPrev" onclick="previousQA()">Previous</button>
                <button class="nav-btn next" id="quizNext" onclick="nextQA()">Next</button>
            </div>
        </div>
    </div>

    <!-- Celebration -->
    <div id="celebration" class="celebration">
        <div class="celebration-emoji">🎉</div>
    </div>


</body>
<script src="./js/app.js"></script>
</html>
